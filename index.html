<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUC - تسجيل حضور المحاضرة</title>
<!-- أيقونة وهوية الجامعة الرسمية لجميع كاميرات الموبايل والمتصفحات -->
    <link rel="icon" type="image/jpeg" href="https://attendance-muc-student.vercel.app/logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="https://attendance-muc-student.vercel.app/logo.jpg">
    <link rel="apple-touch-icon" href="https://attendance-muc-student.vercel.app/logo.jpg">
    <link rel="apple-touch-icon-precomposed" href="https://attendance-muc-student.vercel.app/logo.jpg">
    
    <!-- كروت المشاركة والكاميرات الذكية (Open Graph) برابط مباشر كامل -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="جامعة مايو بالقاهرة - تسجيل الحضور">
    <meta property="og:description" content="منظومة تسجيل الحضور الذكي المباشر - جامعة مايو">
    <meta property="og:image" content="https://attendance-muc-student.vercel.app/logo.jpg">
    <meta property="og:image:secure_url" content="https://attendance-muc-student.vercel.app/logo.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- مكتبة قارئ الـ QR السريعة المعتمدة في مصر -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #7A0C16;
            --secondary: #93131E;
            --accent: #C59B27;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #4A040A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(circle at top right, #93131E, #4A040A) fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #ffffff;
            color: #0F172A;
            width: 100%;
            max-width: 420px;
            border-top: 5px solid var(--accent);
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .logo { height: 75px; object-fit: contain; margin-bottom: 0.75rem; }
        .session-badge {
background: #FDF2F3;
            color: var(--secondary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.35rem 0.85rem;
            border-radius: 50px;
            margin: 0.5rem auto 1.5rem;
            display: inline-block;
        }
        .form-group { text-align: right; margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.4rem; }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .form-group input:focus { outline: none; border-color: var(--secondary); }
        .btn {
            width: 100%;
            padding: 0.9rem;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
                .btn:hover:not(:disabled) { background: #5C080F; }
        .receipt {
            background: #F8FAFC;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1.25rem;
            text-align: right;
            border: 1px solid #E2E8F0;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 0.45rem 0;
            border-bottom: 1px dashed #CBD5E1;
            font-size: 0.9rem;
        }
        .receipt-row:last-child { border-bottom: none; }
        .icon-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }
        .icon-success { background: #ECFDF5; color: var(--success); }
        .icon-danger { background: #FEF2F2; color: var(--danger); }
        .d-none { display: none !important; }
.btn-scan { 
    background: #1E293B !important; 
    padding: 1rem !important; 
    font-size: 1.05rem !important; 
    border-radius: 10px !important;
    margin-bottom: 0.75rem;
}
#qr-reader { 
    width: 100% !important; 
    border-radius: 14px; 
    overflow: hidden; 
    border: 2px solid var(--accent); 
    background: #000;
}
#qr-reader video { 
    width: 100% !important; 
    height: 100% !important; 
    object-fit: cover !important; 
    border-radius: 12px;
}
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.jpg" alt="MUC Logo" class="logo">
        <div id="course-badge" class="session-badge">تسجيل الحضور الذكي المباشر</div>
<!-- زرار فتح الكاميرا المباشر لضمان أمان المتصفح -->
        <div id="scanner-step">
            <button type="button" id="btn-trigger-cam" class="btn btn-scan">
                <i class="fa-solid fa-camera" style="font-size: 1.3rem;"></i> 
                <span>مسح كود البروجيكتور بالكاميرا</span>
            </button>
            <div id="qr-reader" class="d-none"></div>
            <p style="font-size: 0.78rem; color: #94A3B8; margin-top: 0.5rem;">
                <i class="fa-solid fa-wifi-slash"></i> مسح فوري يعمل أوفلاين 100% بدون إنترنت
            </p>
        </div>

        <!-- 2. نموذج إدخال الرقم الجامعي (يظهر تلقائياً بعد لقط الباركود) -->
        <div id="input-step" class="d-none">
            <div style="background: #ECFDF5; border: 1px solid #A7F3D0; padding: 8px 12px; border-radius: 8px; margin-bottom: 1rem;">
                <span style="font-size: 0.82rem; color: #065F46; font-weight: 700;">
                    <i class="fa-solid fa-circle-check"></i> تم مسح المحاضرة: <strong id="detected-course-name">--</strong>
                </span>
            </div>
            <form id="attendance-form">
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                        <label style="margin-bottom:0;"><i class="fa-solid fa-id-card"></i> الرقم الجامعي (Student ID)</label>
                        <button type="button" id="btn-change-saved-id" class="d-none" style="background: none; border: none; color: #DC2626; font-size: 0.78rem; font-weight: 700; cursor: pointer;">
                            <i class="fa-solid fa-pen-to-square"></i> تغيير الرقم
                        </button>
                    </div>
                    <input type="text" id="student-id" placeholder="مثال: 25120905" inputmode="numeric" required>
                </div>
                <button type="submit" id="btn-submit" class="btn">
                    <span>تأكيد الحضور الآن</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </form>
        </div>

        <!-- 2. بطاقة النتيجة (نجاح أو رفض الجهاز) -->
        <div id="result-step" class="d-none">
            <div id="status-icon" class="icon-circle"></div>
            <h3 id="status-title" style="font-size: 1.2rem; margin-bottom: 0.5rem;"></h3>
            <p id="status-msg" style="color: #64748B; font-size: 0.9rem;"></p>
                        <button type="button" id="btn-retry" class="btn d-none" style="margin-top:1rem;">
                <i class="fa-solid fa-rotate-right"></i><span>إعادة المحاولة</span>
            </button>

<div id="receipt-box" class="receipt d-none">
    <div class="receipt-row"><span>اسم الطالب:</span><strong id="rcpt-name">--</strong></div>
    <div class="receipt-row"><span>الرقم الجامعي:</span><strong id="rcpt-id">--</strong></div>
    <div class="receipt-row"><span>المقرر الدراسي:</span><strong id="rcpt-course">--</strong></div>
    <div class="receipt-row"><span>المحاضرة / الجلسة:</span><strong id="rcpt-session-num" style="color: var(--primary);">--</strong></div>
    <div class="receipt-row"><span>تاريخ الجلسة:</span><strong id="rcpt-date">--</strong></div>
    <div class="receipt-row"><span>وقت التسجيل:</span><strong id="rcpt-time">--</strong></div>
    <div class="receipt-row"><span>الحالة:</span><strong id="rcpt-status" style="color: var(--success);">حاضر (Present)</strong></div>
</div>
        </div>
    </div>

    <div style="position:fixed; bottom:0; left:0; right:0; text-align:center; padding:0.6rem 0.75rem; font-size:0.75rem; font-weight:700; color:#E5C158; background:rgba(0,0,0,0.25);">
        تم تصميم وتنفيذ البرنامج بواسطة فريق عمل من كلية الهندسة جامعة مايو بالقاهرة
    </div>

    <!-- فحص بصمة الجهاز والاتصال المباشر بقاعدة البيانات -->
    <script type="module">
import { recordStudentAttendance, queueOfflineAttendance, syncPendingAttendance } from "./firebase.js";
// 🚀 تسجيل الـ Service Worker عشان الموبايل يفتح أوفلاين
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js").then(() => {
                console.log("Service Worker Active ✅");
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        let activeSessionId = urlParams.get("session");
        let activeToken = urlParams.get("token");
        let offlinePayload = null;

        // توليد أو جلب بصمة الهاتف
        let deviceId = localStorage.getItem("muc_device_fingerprint");
        if (!deviceId) {
            deviceId = "dev_" + Math.random().toString(36).substring(2) + "_" + Date.now();
            localStorage.setItem("muc_device_fingerprint", deviceId);
        }

        const scannerStep = document.getElementById("scanner-step");
        const inputStep = document.getElementById("input-step");
        const resultStep = document.getElementById("result-step");
        const inputId = document.getElementById("student-id");
        const courseBadge = document.getElementById("course-badge");
        const detectedCourse = document.getElementById("detected-course-name");
        const btnTriggerCam = document.getElementById("btn-trigger-cam");
        const qrBox = document.getElementById("qr-reader");

        // استرجاع الرقم الجامعي إن كان مسجلاً سابقاً
        const savedStudentId = localStorage.getItem("muc_saved_student_id");
        if (savedStudentId) {
            inputId.value = savedStudentId;
            document.getElementById("btn-change-saved-id")?.classList.remove("d-none");
        }

        document.getElementById("btn-change-saved-id")?.addEventListener("click", () => {
            const newId = prompt("أدخل الرقم الجامعي الجديد:", inputId.value);
            if (newId && newId.trim()) {
                localStorage.setItem("muc_saved_student_id", newId.trim());
                inputId.value = newId.trim();
            }
        });

        // إذا دخل الطالب برابط مسح مسبقاً (أونلاين)
        if (activeSessionId && activeToken) {
            scannerStep.classList.add("d-none");
            inputStep.classList.remove("d-none");
            courseBadge.innerText = "جلسة مباشرة (Online)";
            detectedCourse.innerText = "محاضرة مباشرة";
        }

        // تشغيل الكاميرا فور الضغط على الزرار
        let html5QrScanner = null;
        btnTriggerCam?.addEventListener("click", async () => {
            btnTriggerCam.classList.add("d-none");
            qrBox.classList.remove("d-none");
            startCameraScanner();
        });

        async function startCameraScanner() {
            if (typeof Html5Qrcode === "undefined") {
                alert("جاري تجهيز الكاميرا، تأكد من فتح الصفحة بالإنترنت لمرة واحدة.");
                btnTriggerCam.classList.remove("d-none");
                qrBox.classList.add("d-none");
                return;
            }

            try {
                html5QrScanner = new Html5Qrcode("qr-reader");
                await html5QrScanner.start(
                    { facingMode: "environment" },
                    { 
                        fps: 25,
                        qrbox: (w, h) => {
                            const size = Math.floor(Math.min(w, h) * 0.85);
                            return { width: size, height: size };
                        }
                    },
                    async (decodedText) => {
                        try {
                            if (decodedText.startsWith("{")) {
                                offlinePayload = JSON.parse(decodedText);
                                activeSessionId = offlinePayload.s;
                                detectedCourse.innerText = offlinePayload.cn || "المقرر الدراسي";
                                courseBadge.innerText = `محاضرة: ${offlinePayload.cn || ''}`;
                            } else if (decodedText.includes("session=")) {
                                const parsed = new URL(decodedText);
                                activeSessionId = parsed.searchParams.get("session");
                                activeToken = parsed.searchParams.get("token");
                                detectedCourse.innerText = "محاضرة مباشرة (سحابية)";
                            } else {
                                throw new Error("رمز غير صالح!");
                            }

                            await html5QrScanner.stop();
                            scannerStep.classList.add("d-none");
                            inputStep.classList.remove("d-none");
                            inputId.focus();
                        } catch (e) {
                            alert("رمز QR غير صالح، صوّب الكاميرا نحو باركود الشاشة.");
                        }
                    },
                    () => {}
                );
            } catch (err) {
                alert("يرجى إعطاء المتصفح إذن الوصول للكاميرا.");
                btnTriggerCam.classList.remove("d-none");
                qrBox.classList.add("d-none");
            }
        }

        // 3. تأكيد الحضور
// 3. تأكيد الحضور
document.getElementById("attendance-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const sid = inputId.value.trim();
    if (!sid) return;

    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري التثبيت...`;

    try {
        localStorage.setItem("muc_saved_student_id", sid);

        // جلب الاسم المحفوظ سابقاً للموبايل أو إظهار "طالب" لو أول مرة يسجل أوفلاين
        const cachedStudentName = localStorage.getItem(`muc_student_name_${sid}`) || localStorage.getItem("muc_saved_student_name") || "طالب";
        const sessionNumLabel = offlinePayload?.sn || offlinePayload?.sessionName || (offlinePayload?.s ? `جلسة #${offlinePayload.s.slice(-4)}` : "محاضرة مباشرة");

        // أ. لو أوفلاين
        if (offlinePayload) {
            await queueOfflineAttendance({
                studentId: sid,
                studentName: cachedStudentName,
                sessionId: offlinePayload.s,
                courseId: offlinePayload.c,
                courseName: offlinePayload.cn,
                timeSlot: offlinePayload.t,
                hash: offlinePayload.h
            });

            showResult(true, "تم تثبيت الحضور بنجاح!", "محفوظ على هاتفك وسيرتفع تلقائياً للسيرفر فور التقاط الشبكة.");
            
            document.getElementById("rcpt-name").innerText = cachedStudentName;
            document.getElementById("rcpt-id").innerText = sid;
            document.getElementById("rcpt-course").innerText = offlinePayload.cn || "المقرر الدراسي";
            document.getElementById("rcpt-session-num").innerText = sessionNumLabel;
            document.getElementById("rcpt-date").innerText = new Date().toLocaleDateString("ar-EG");
            document.getElementById("rcpt-time").innerText = new Date().toLocaleTimeString("ar-EG");
            document.getElementById("rcpt-status").innerText = navigator.onLine ? "متزامن سحابياً ✅" : "محفوظ أوفلاين ⏳";
            document.getElementById("receipt-box").classList.remove("d-none");
            return;
        }

        // ب. لو أونلاين
        let deviceId = localStorage.getItem("muc_device_fingerprint") || ("dev_" + Math.random().toString(36).substring(2));
        localStorage.setItem("muc_device_fingerprint", deviceId);

        const res = await recordStudentAttendance(activeSessionId, activeToken, sid, deviceId);
        
        // حفظ اسم الطالب الحقيقي من الفايربيز في الموبايل لاستخدامه مستقبلاً في الأوفلاين
        if (res.studentName) {
            localStorage.setItem(`muc_student_name_${sid}`, res.studentName);
            localStorage.setItem("muc_saved_student_name", res.studentName);
        }

        showResult(true, "تم تسجيل الحضور في السجل المباشر!", `تم ظهور اسمك الآن على شاشة المحاضرة.`);
        document.getElementById("rcpt-name").innerText = res.studentName;
        document.getElementById("rcpt-id").innerText = res.studentId;
        document.getElementById("rcpt-course").innerText = res.courseName;
        document.getElementById("rcpt-session-num").innerText = res.sessionType || "محاضرة مباشرة";
        document.getElementById("rcpt-date").innerText = res.date;
        document.getElementById("rcpt-time").innerText = res.time;
        document.getElementById("rcpt-status").innerText = res.status === "Present" ? "حاضر (Present)" : "متأخر (Late)";
        document.getElementById("receipt-box").classList.remove("d-none");

    } catch (err) {
        showResult(false, "تم رفض التسجيل", err.message);
        btn.disabled = false;
        btn.innerHTML = `<span>تأكيد الحضور الآن</span> <i class="fa-solid fa-arrow-left"></i>`;
    }
});

        function showResult(isSuccess, title, msg, canRetry = !isSuccess) {
            inputStep.classList.add("d-none");
            resultStep.classList.remove("d-none");
            document.getElementById("btn-retry").classList.toggle("d-none", !canRetry);

            const icon = document.getElementById("status-icon");
            icon.className = "icon-circle " + (isSuccess ? "icon-success" : "icon-danger");
            icon.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-check' : 'fa-triangle-exclamation'}"></i>`;

            document.getElementById("status-title").innerText = title;
            document.getElementById("status-msg").innerText = msg;
        }

        document.getElementById("btn-retry").addEventListener("click", () => {
            resultStep.classList.add("d-none");
            inputStep.classList.remove("d-none");
        });

        // مزامنة أي حضور قديم تلقائياً
        syncPendingAttendance();
    </script>
</body>
</html>
